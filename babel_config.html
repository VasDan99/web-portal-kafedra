<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
from flask_babel import Babel
from app import app

babel = Babel(app)

@babel.localeselector
def get_locale():
    from flask import session
    lang = session.get('lang')
    if lang in ['ru', 'en', 'zh']:
        return lang
    return 'ru'
</body>
</html>
