<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "admin/base.html" %}

{% block title %}Админ-панель{% endblock %}

{% block admin_content %}
<h2>Добро пожаловать в админ-панель</h2>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
    <div style="background: #003366; color: white; padding: 20px; border-radius: 8px; text-align: center;">
        <div style="font-size: 36px;">{{ students_count }}</div>
        <div>Студентов</div>
    </div>
    <div style="background: #005599; color: white; padding: 20px; border-radius: 8px; text-align: center;">
        <div style="font-size: 36px;">{{ teachers_count }}</div>
        <div>Преподавателей</div>
    </div>
    <div style="background: #0077cc; color: white; padding: 20px; border-radius: 8px; text-align: center;">
        <div style="font-size: 36px;">{{ disciplines_count }}</div>
        <div>Дисциплин</div>
    </div>
    <div style="background: #0099ee; color: white; padding: 20px; border-radius: 8px; text-align: center;">
        <div style="font-size: 36px;">{{ works_count }}</div>
        <div>Работ</div>
    </div>
</div>
{% endblock %}
</body>
</html>
