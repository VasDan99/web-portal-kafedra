<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "base.html" %}

{% block content %}
<div style="display: flex; gap: 20px;">
    <!-- Боковое меню админа -->
    <div style="width: 280px; background: #f5f5f5; padding: 20px; border-radius: 8px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <h3>Админ-панель</h3>
            <p style="color: #666;">{{ current_user.username }}</p>
        </div>
        <hr>
        <ul style="list-style: none; padding: 0;">
            <li><a href="{{ url_for('main.admin_dashboard') }}" style="display: block; padding: 8px; color: #003366; text-decoration: none;">📊 Главная</a></li>
            <li><a href="{{ url_for('main.admin_students') }}" style="display: block; padding: 8px; color: #003366; text-decoration: none;">🧑‍🎓 Студенты</a></li>
            <li><a href="{{ url_for('main.admin_teachers') }}" style="display: block; padding: 8px; color: #003366; text-decoration: none;">👨‍🏫 Преподаватели</a></li>
            <li><a href="{{ url_for('main.admin_schedule') }}" style="display: block; padding: 8px; color: #003366; text-decoration: none;">📅 Расписание</a></li>
            <li><a href="{{ url_for('main.admin_news') }}" style="display: block; padding: 8px; color: #003366; text-decoration: none;">📰 Новости</a></li>
            <li><a href="{{ url_for('main.admin_feedback') }}" style="display: block; padding: 8px; color: #003366; text-decoration: none;">💬 Сообщения</a></li>
            <li><a href="{{ url_for('main.admin_settings') }}" style="display: block; padding: 8px; color: #003366; text-decoration: none;">⚙️ Настройки</a></li>
        </ul>
    </div>

    <!-- Основной контент -->
    <div style="flex: 1; background: white; padding: 25px; border-radius: 8px;">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
</body>
</html>
