{% extends "base.html" %}

{% block content %}
<div style="display: flex; gap: 20px;">
    <!-- Боковое меню админа -->
    <div style="width: 280px; background: #f5f5f5; padding: 20px; border-radius: 8px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <h3>Админ-панель</h3>
            <p style="color: #666;">{{ current_user.username }}</p>
        </div>
        <hr>
        <ul style="list-style: none; padding: 0;">
            <li><a href="{{ url_for('main.admin_dashboard') }}">📊 Главная</a></li>
            <li><a href="{{ url_for('main.admin_students') }}">🧑‍🎓 Студенты</a></li>
            <li><a href="{{ url_for('main.admin_teachers') }}">👨‍🏫 Преподаватели</a></li>
            <li><a href="{{ url_for('main.admin_schedule') }}">📅 Расписание</a></li>
            <li><a href="{{ url_for('main.admin_news') }}">📰 Новости</a></li>
            <li><a href="{{ url_for('main.admin_all_messages') }}">💬 Все сообщения</a></li>
        </ul>
    </div>

    <!-- Основной контент -->
    <div style="flex: 1; background: white; padding: 25px; border-radius: 8px;">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
