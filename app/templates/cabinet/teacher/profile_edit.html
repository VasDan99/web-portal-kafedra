<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "cabinet/teacher/teacher_base.html" %}

{% block title %}Редактирование профиля{% endblock %}

{% block teacher_content %}
<h2>Редактирование профиля</h2>

<form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ form.csrf_token._value() if form.csrf_token else '' }}">

    <div style="margin-bottom: 15px;">
        <label>ФИО</label><br>
        <input type="text" name="full_name" value="{{ form.full_name.data or '' }}" size="50" class="form-control">
    </div>

    <div style="margin-bottom: 15px;">
        <label>Кафедра</label><br>
        <input type="text" name="department" value="{{ form.department.data or '' }}" size="50" class="form-control">
    </div>

    <div style="margin-bottom: 15px;">
        <label>Должность</label><br>
        <input type="text" name="position" value="{{ form.position.data or '' }}" size="50" class="form-control">
    </div>

    <div style="margin-bottom: 15px;">
        <label>Учёная степень</label><br>
        <input type="text" name="degree" value="{{ form.degree.data or '' }}" size="50" class="form-control">
    </div>

    <div style="margin-bottom: 15px;">
        <label>Телефон</label><br>
        <input type="text" name="phone" value="{{ form.phone.data or '' }}" size="50" class="form-control">
    </div>

    <div style="margin-bottom: 15px;">
        <label>О себе</label><br>
        <textarea name="bio" rows="5" cols="50" class="form-control">{{ form.bio.data or '' }}</textarea>
    </div>

    <div style="margin-bottom: 15px;">
        <label>Фото профиля</label><br>
        <input type="file" name="avatar" class="form-control">
        {% if teacher.avatar %}
            <p><img src="{{ teacher.avatar }}" style="max-width: 100px; border-radius: 50%; margin-top: 10px;"></p>
        {% endif %}
    </div>

    <div>
        <button type="submit" name="submit" class="btn btn-primary" style="background: #003366; color: white; border: none; padding: 10px 30px; border-radius: 5px;">Сохранить изменения</button>
        <a href="{{ url_for('main.teacher_profile') }}" style="margin-left: 10px;">Отмена</a>
    </div>
</form>
{% endblock %}
</body>
</html>
