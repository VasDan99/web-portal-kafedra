<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "base.html" %}

{% block content %}
<div style="display: flex; gap: 20px;">
    <div style="width: 250px; background: #f5f5f5; padding: 20px; border-radius: 8px;">
        <div style="text-align: center;">
            <img src="{{ student.avatar or '/static/images/default-avatar.png' }}" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;">
            <h3>{{ student.full_name }}</h3>
            <p>{{ student.group_name }}, {{ student.course }} курс</p>
        </div>
        <hr>
        <ul style="list-style: none; padding: 0;">
            <li><a href="{{ url_for('main.student_profile') }}" style="display: block; padding: 8px; color: #003366;">📋 Мой профиль</a></li>
            <li><a href="{{ url_for('main.student_grades') }}" style="display: block; padding: 8px; color: #003366;">📊 Мои оценки</a></li>
            <li><a href="{{ url_for('main.student_schedule') }}" style="display: block; padding: 8px; color: #003366;">📅 Расписание</a></li>
            <li><a href="{{ url_for('main.student_documents') }}" style="display: block; padding: 8px; color: #003366;">📁 Мои документы</a></li>
            <li><a href="{{ url_for('main.student_settings') }}" style="display: block; padding: 8px; color: #003366;">⚙️ Настройки</a></li>
        </ul>
    </div>
    <div style="flex: 1;">
        {% block cabinet_content %}{% endblock %}
    </div>
</div>
{% endblock %}
</body>
</html>
